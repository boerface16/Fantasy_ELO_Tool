# ESPN H2H Points League Scoring
# Format: H2H Points
# Lineup: C, 1B, 2B, 3B, SS, DH/UTIL, OF×3, SP/RP×3, Bench×3, IL×3

batter:
  TB: 1       # Total bases: 1B=1, 2B=2, 3B=3, HR=4
  R: 1        # Runs scored
  RBI: 1      # Runs batted in
  BB: 1       # Walks
  SB: 1       # Stolen bases
  SO: -1      # Strikeouts
  E: -3       # Errors

pitcher:
  IP: 3       # Per full inning pitched
  K: 1        # Strikeouts
  W: 5        # Wins
  SV: 5       # Saves
  H: -1       # Hits allowed
  ER: -1      # Earned runs
  HR: -1      # Home runs allowed
  BB: -1      # Walks issued
  HB: 1       # Hit batsmen
  L: -5       # Losses
  BS: -5      # Blown saves
  B: -10      # Balks
  PKO: 2      # Pick offs
  CG: 3       # Complete games
  SHO: 5      # Shutouts
  NH: 10      # No hitters
  PG: 11      # Perfect games

# Calibration parameters for batter R/RBI estimation
calibration:
  r_per_tb: 0.40    # Expected runs per total base
  rbi_per_tb: 0.45  # Expected RBI per total base
